name: "✨ Feature Request / 功能请求"
description: |
  Propose a new feature or improvement.
  提出新功能或改进建议。
labels:
  - enhancement
body:
  - type: textarea
    id: description
    attributes:
      label: Your Idea / 具体建议
      description: |
        A title and a description of your idea or use case are enough. Solutions and screenshots are optional.
        填写标题和具体建议或使用场景即可。方案、截图等信息可选。
      placeholder: |
        I'd like to ... because ...
        我希望能……，因为……
    validations:
      required: true
