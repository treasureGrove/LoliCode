name: "🐛 Bug Report / Bug 报告"
description: |
  Report errors or unexpected behavior.
  报告错误或异常行为。
labels:
  - bug
body:
  - type: textarea
    id: description
    attributes:
      label: What Happened / 具体现象
      description: |
        A title and a description of what happened are enough. Version, OS, steps, screenshots, and redacted logs are optional.
        填写标题和具体现象即可。版本、系统、操作步骤、截图和脱敏日志都可选，有的话可以一起补充。
      placeholder: |
        I was ... when ... happened.
        我在……时，出现了……
    validations:
      required: true
