name: "📖 Documentation Issue / 文档问题"
description: |
  Report documentation errors, outdated content, or missing information.
  报告文档错误、过时内容或缺失信息。
labels:
  - documentation
body:
  - type: textarea
    id: description
    attributes:
      label: Description / 描述
      description: |
        A title and a description of the documentation issue are enough. Links, language, and screenshots are optional.
        填写标题和具体文档问题即可。文档链接、语言、截图等信息可选。
      placeholder: |
        The docs say ... but ...
        文档中……，但实际……
    validations:
      required: true
