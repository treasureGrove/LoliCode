name: "❓ Question / 提问"
description: |
  Ask a question about usage or configuration.
  询问使用或配置相关问题。
labels:
  - question
body:
  - type: textarea
    id: description
    attributes:
      label: Your Question / 你的问题
      description: |
        A title and your question are enough. Environment details, things you've tried, and screenshots are optional.
        填写标题和你遇到的问题即可。环境、已尝试的方法、截图等信息可选。
      placeholder: |
        I'd like to know how to ...
        我想知道如何……
    validations:
      required: true
