name: Dependabot 中文摘要

on:
  pull_request_target:
    types: [opened, reopened, synchronize, edited, ready_for_review]
  workflow_dispatch:
    inputs:
      pr_number:
        description: "PR 编号；留空为所有未关闭的 Dependabot PR 补充摘要"
        required: false
        type: string

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: dependabot-summary-${{ github.event.pull_request.number || 'backfill' }}
  cancel-in-progress: false

jobs:
  summarize:
    if: github.event_name == 'workflow_dispatch' || github.event.pull_request.user.login == 'dependabot[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      # pull_request_target 只读取目标分支的脚本，不检出或执行 PR 中的代码。
      - name: Checkout summary scripts from the base branch
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ github.event.pull_request.base.sha || github.sha }}
          persist-credentials: false
          sparse-checkout: .github/scripts

      - name: Test summary generation
        run: node --test .github/scripts/dependabot-summary.test.cjs

      - name: Create or update Chinese summary
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          PR_NUMBER: ${{ inputs.pr_number }}
        with:
          script: |
            const { run } = require('./.github/scripts/dependabot-summary.cjs');
            await run({ github, context, core, prNumber: process.env.PR_NUMBER });
