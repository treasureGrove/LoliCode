name: Test-instrumented native GUI smoke (NOT A RELEASE)
on:
  push:
    branches: [test/native-gui-smoke-20261107]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  gui:
    if: github.repository == 'treasureGrove/LoliCode' && github.ref == 'refs/heads/test/native-gui-smoke-20261107'
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 110
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            platform: darwin
            arch: arm64
            target: aarch64-apple-darwin
          - runner: macos-15-intel
            platform: darwin
            arch: x64
            target: x86_64-apple-darwin
          - runner: ubuntu-22.04
            platform: linux
            arch: x64
            target: x86_64-unknown-linux-gnu
    defaults:
      run:
        shell: bash
    env:
      EXPECTED_PLATFORM: ${{ matrix.platform }}
      EXPECTED_ARCH: ${{ matrix.arch }}
      EXPECTED_RUST_TARGET: ${{ matrix.target }}
      COREPACK_ENABLE_DOWNLOAD_PROMPT: "0"
      CARGO_BUILD_JOBS: "2"
      CARGO_INCREMENTAL: "0"
      CARGO_PROFILE_DEV_DEBUG: "0"
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version-file: .node-version
          architecture: ${{ matrix.arch }}
      - name: Read pinned Rust
        id: rust
        run: |
          channel=$(sed -nE 's/^channel *= *"([^"]+)".*/\1/p' rust-toolchain.toml)
          test -n "$channel"
          echo "channel=$channel" >> "$GITHUB_OUTPUT"
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: ${{ steps.rust.outputs.channel }}
      - name: Verify disposable native host
        run: |
          test "$RUNNER_ENVIRONMENT" = github-hosted
          test "$(rustc -vV | sed -n 's/^host: //p')" = "$EXPECTED_RUST_TARGET"
          node -e 'if (process.platform !== process.env.EXPECTED_PLATFORM || process.arch !== process.env.EXPECTED_ARCH) process.exit(1)'
      - name: Install Linux GUI dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends build-essential pkg-config libssl-dev libgtk-3-dev libwebkit2gtk-4.1-dev libsoup-3.0-dev libxdo-dev libayatana-appindicator3-dev librsvg2-dev patchelf dbus-x11 xvfb xauth
      - name: Require macOS GUI session
        if: runner.os == 'macOS'
        run: |
          xcrun --find clang
          pgrep -x WindowServer >/dev/null
      - name: Install pinned dependencies
        run: |
          corepack enable
          corepack install
          pnpm install --frozen-lockfile
          npm ci --prefix packages/companion-relay --ignore-scripts --no-audit --no-fund
      - name: Test smoke contracts
        run: node --test scripts/tests/native-gui-smoke.test.mjs
      - name: Prepare native runtime assets
        run: |
          mkdir -p dist dist-dev
          node scripts/build/prepare-agent-assets.mjs
          node scripts/build/prepare-lolicode-harness-runtime.mjs --bundle
          node scripts/tests/verify-native-build.mjs runtime
      - name: Run real native WebView smoke
        timeout-minutes: 80
        run: |
          if [ "$EXPECTED_PLATFORM" = linux ]; then
            dbus-run-session -- xvfb-run -a -s '-screen 0 1280x900x24' node scripts/tests/native-gui-smoke.mjs
          else
            node scripts/tests/native-gui-smoke.mjs
          fi
      - name: State verification boundary
        if: always()
        env:
          RESULT: ${{ job.status }}
        run: |
          printf 'Job: %s; SHA: %s. WKWebView/WebKitGTK test-instrumented development renderer on a disposable hosted VM. No release package, signing, notarization, installation, user-machine or formal-renderer acceptance. No artifacts uploaded. System permission, TCC or Gatekeeper prompts block this check; never bypass them.\n' "$RESULT" "$GITHUB_SHA" >> "$GITHUB_STEP_SUMMARY"
