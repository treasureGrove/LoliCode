name: LoliCode Windows stable release

# LoliCode owns its signing key and download namespace. Ordinary tags must not
# trigger the inherited upstream multi-platform publication pipeline.
on:
  workflow_dispatch:
    inputs:
      version:
        description: Version already committed in package.json and tauri.conf.json
        required: true
        type: string
      publish_github:
        description: Publish signed Windows files to a LoliCode GitHub Release
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: lolicode-release-${{ inputs.version }}
  cancel-in-progress: false

jobs:
  windows-x64:
    runs-on: windows-2022
    environment: release
    permissions:
      contents: write
    env:
      RELEASE_VERSION: ${{ inputs.version }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: "20"
      - name: Read pinned Rust toolchain
        id: rust
        shell: pwsh
        run: |
          $toolchain = Select-String -Path rust-toolchain.toml -Pattern '^channel\s*=\s*"([^"]+)"'
          "channel=$($toolchain.Matches[0].Groups[1].Value)" >> $env:GITHUB_OUTPUT
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: ${{ steps.rust.outputs.channel }}
      - name: Check version and release notes
        shell: pwsh
        run: |
          if ($env:RELEASE_VERSION -notmatch '^\d+\.\d+\.\d+$') { throw 'Expected a stable SemVer.' }
          $productVersion = node --input-type=module -e "import { productVersion } from './scripts/release/lolicode-product-version.mjs'; process.stdout.write(productVersion(process.env.RELEASE_VERSION));"
          "PRODUCT_VERSION=$productVersion" >> $env:GITHUB_ENV
          $packageVersion = (Get-Content -Raw package.json | ConvertFrom-Json).version
          $tauriVersion = (Get-Content -Raw src-tauri/tauri.conf.json | ConvertFrom-Json).version
          if ($packageVersion -ne $env:RELEASE_VERSION -or $tauriVersion -ne $env:RELEASE_VERSION) { throw 'Commit the release version before running this workflow.' }
          if (-not (Test-Path "src/whats-new/$env:RELEASE_VERSION.json")) { throw 'Missing in-app release notes.' }
      - name: Install dependencies
        shell: pwsh
        run: |
          corepack enable
          corepack install
          pnpm install --frozen-lockfile
      - name: Validate release
        shell: pwsh
        run: |
          pnpm typecheck
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          pnpm exec vitest run tests/config/whatsNewEntries.test.ts tests/lib/whatsNew.test.ts tests/lib/updater.test.ts
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node --test scripts/tests/lolicode-release.test.mjs scripts/tests/lolicode-publish.test.mjs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node --test scripts/tests/lolicode-nsis-upgrade-guard.test.mjs scripts/tests/lolicode-nsis-resource-layout.test.mjs scripts/tests/lolicode-nsis-overwrite-upgrade.test.mjs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node --test scripts/tests/lolicode-bundled-mascot.test.mjs
          exit $LASTEXITCODE
      - name: Build signed LoliCode installer
        shell: pwsh
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          if (-not $env:TAURI_SIGNING_PRIVATE_KEY) { throw 'Configure the LoliCode signing key in the release environment.' }
          pnpm build:release --bundles nsis --ci
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $env:LOLICODE_NSIS_GENERATED_SCRIPT = (Resolve-Path "src-tauri/target/release/nsis/x64/installer.nsi").Path
          $env:LOLICODE_NSIS_EXPECTED_VERSION = $env:RELEASE_VERSION
          node --test scripts/tests/lolicode-nsis-built-payload.test.mjs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $installer = "src-tauri/target/release/bundle/nsis/LoliCode_$($env:RELEASE_VERSION)_x64-setup.exe"
          if (-not (Test-Path "$installer.sig")) { throw 'Missing updater signature.' }
          node scripts/release/lolicode-release.mjs prepare --installer $installer --signature "$installer.sig" --public-key-file src-tauri/updater.pub --version "$env:RELEASE_VERSION" --current-version 0.0.0 --base-url https://tools.treasuregrove.art/lolicode/releases --latest-url https://tools.treasuregrove.art/lolicode/updates/latest.json --output-dir "$env:RUNNER_TEMP/lolicode-release"
          exit $LASTEXITCODE
      - uses: actions/upload-artifact@v7
        with:
          name: LoliCode-${{ inputs.version }}-Windows-x64
          path: |
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/bundle/nsis/*.exe.sig
          if-no-files-found: error
      - name: Publish GitHub release
        if: inputs.publish_github
        shell: pwsh
        env:
          # The source repository is private. Distribution is a separate public
          # repository; its scoped write credential must be configured explicitly.
          GH_TOKEN: ${{ secrets.LOLICODE_RELEASES_TOKEN }}
        run: |
          if (-not $env:GH_TOKEN) { throw 'Configure LOLICODE_RELEASES_TOKEN for treasureGrove/LoliCode-Releases in the release environment.' }
          $installer = "$env:RUNNER_TEMP/lolicode-release/$($env:PRODUCT_VERSION)/LoliCode-$($env:PRODUCT_VERSION)-Windows-x64-Setup.exe"
          $summary = Get-Content -Raw "src/whats-new/$env:RELEASE_VERSION.json" | ConvertFrom-Json
          $notes = @('LoliCode desktop update', '', 'Download website: https://lolicode.com/', "Build source commit: $env:GITHUB_SHA", '')
          $notes += $summary.items | ForEach-Object { '- ' + $_.en }
          $notes | Set-Content -Encoding utf8 "$env:RUNNER_TEMP/lolicode-release-notes.md"
          gh release create "lolicode-v$env:PRODUCT_VERSION" $installer "$installer.sig" --repo treasureGrove/LoliCode-Releases --target main --title "LoliCode $env:PRODUCT_VERSION" --notes-file "$env:RUNNER_TEMP/lolicode-release-notes.md"
          exit $LASTEXITCODE

# The signed website feed is published separately with scripts/release/lolicode-publish.mjs.
# This workflow never writes another project's R2 bucket or changes the live feed.
