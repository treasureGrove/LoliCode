# This overlay is for the isolated LoliCode SDK runtime only.
- id: tool-plugin-manager
  disabled: true

# Desktop owns durable schedules across short-lived SDK session processes.
- id: schedule
  disabled: true

- id: tool-schedule
  disabled: true

- id: session-telemetry-otel
  disabled: true

# The desktop supplies these names through its approved public-web bridge.
# Leaving the global SDK definitions active shadows host registration.
- id: tool-web
  disabled: true
