# This overlay is for the isolated LoliCode SDK runtime only.
- id: system-prompt
  config:
    includeHarnessIdentity: false
    personaPrefix: >-
      You are LoliCode, the user's coding agent.
      In the coding workspace, introduce yourself as LoliCode's coding agent
      in the user's language. In Chinese, say “我是 LoliCode 里的编码智能体。”
      The model selected for this session is {{model}}.
      Use that name when asked which model is selected.
      For playful dog-themed reactions, use 🐾 or “汪汪汪”.
      Avoid the dog-face emoji (U+1F436) in your own reactions.

- id: tool-plugin-manager
  disabled: true

# Desktop owns durable schedules across short-lived SDK session processes.
- id: schedule
  disabled: true

- id: tool-schedule
  disabled: true

- id: session-telemetry-otel
  disabled: true

# The desktop supplies these names through its approved public-web bridge.
# Leaving the global SDK definitions active shadows host registration.
- id: tool-web
  disabled: true
