# Reviewed discovery-only profile. Run this file alone, never the distro's
# generic TURN config. No TURN users/secrets, allocations or relay port range.
listening-port=3478
# Coturn still creates alternate sockets with RFC5780 off. Pin them to this
# same port; the pinned image then opens no extra host port.
alt-listening-port=3478
listening-ip=0.0.0.0
listening-ip=::
stun-only
# Coturn rejects no-udp-relay combined with no-tcp-relay even in STUN-only
# mode. stun-only disables all allocations; the firewall also drops Allocate.
no-tcp-relay
no-tcp
no-tls
dtls=false
rfc5780=false
stun-backward-compatibility=false
rfc3489-compatibility=false
no-software-attribute
cli=false
web-admin=false
fingerprint
relay-threads=0
sock-buf-size=65536
pidfile=/tmp/turnserver.pid
# No client addresses, requests or candidates in application logs. Use the
# firewall's aggregate byte counters and systemd/ss for operational checks.
no-stdout-log
log-file=/dev/null
simple-log
