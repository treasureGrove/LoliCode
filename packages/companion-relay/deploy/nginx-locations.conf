# Include inside the existing HTTPS server block for lolicode.com.
# The companion container uses Linux --network host and binds 127.0.0.1:13010.
# This exact external URL is also the relayUrl in the pairing QR.
location = /companion/ws {
    limit_req zone=lolicode_companion_handshake burst=10 nodelay;
    limit_req_status 429;
    limit_conn lolicode_companion_connections 12;
    proxy_pass http://127.0.0.1:13010/companion;
    proxy_http_version 1.1;
    proxy_set_header Host lolicode-companion.internal;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_set_header X-Forwarded-Proto https;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Host "";
    proxy_set_header Forwarded "";
    proxy_set_header Cookie "";
    proxy_read_timeout 75s;
    proxy_send_timeout 30s;
    proxy_buffering off;
    proxy_request_buffering off;
    client_max_body_size 64k;
    access_log off;
}

# Account enrollment is control traffic only. Preserve Origin so the native-only
# upstream can reject browser access; never log Authorization or request bodies.
location = /companion/v2/session {
    limit_req zone=lolicode_companion_session burst=2 nodelay;
    limit_req_status 429;
    limit_conn lolicode_companion_connections 12;
    client_max_body_size 8k;
    client_body_timeout 5s;
    proxy_pass http://127.0.0.1:13010/v2/session;
    proxy_http_version 1.1;
    proxy_set_header Host lolicode-companion.internal;
    proxy_set_header Authorization $http_authorization;
    proxy_set_header Cookie "";
    proxy_set_header Connection "";
    proxy_set_header X-Forwarded-Proto https;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Host "";
    proxy_set_header Forwarded "";
    proxy_connect_timeout 3s;
    proxy_read_timeout 25s;
    proxy_send_timeout 10s;
    proxy_buffering off;
    proxy_request_buffering on;
    error_page 429 = @lolicode_companion_rate_limited;
    error_page 413 = @lolicode_companion_body_too_large;
    error_page 502 503 504 = @lolicode_companion_unavailable;
    access_log off;
}

location ^~ /companion/v2/ {
    limit_req zone=lolicode_companion_http burst=20 nodelay;
    limit_req_status 429;
    limit_conn lolicode_companion_connections 12;
    client_max_body_size 8k;
    client_body_timeout 5s;
    proxy_pass http://127.0.0.1:13010/v2/;
    proxy_http_version 1.1;
    proxy_set_header Host lolicode-companion.internal;
    proxy_set_header Authorization $http_authorization;
    proxy_set_header Cookie "";
    proxy_set_header Connection "";
    proxy_set_header X-Forwarded-Proto https;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Host "";
    proxy_set_header Forwarded "";
    proxy_connect_timeout 3s;
    proxy_read_timeout 10s;
    proxy_send_timeout 10s;
    proxy_buffering off;
    proxy_request_buffering on;
    error_page 429 = @lolicode_companion_rate_limited;
    error_page 413 = @lolicode_companion_body_too_large;
    error_page 502 503 504 = @lolicode_companion_unavailable;
    access_log off;
}

location = /companion/v2 {
    default_type application/json;
    add_header Cache-Control no-store always;
    return 404 '{"error":{"code":"not_found","message":"Resource not found."}}';
    access_log off;
}

location @lolicode_companion_rate_limited {
    default_type application/json;
    add_header Cache-Control no-store always;
    return 429 '{"error":{"code":"rate_limited","message":"Too many requests."}}';
    access_log off;
}
location @lolicode_companion_body_too_large {
    default_type application/json;
    add_header Cache-Control no-store always;
    return 413 '{"error":{"code":"body_too_large","message":"Request body exceeds limit."}}';
    access_log off;
}
location @lolicode_companion_unavailable {
    default_type application/json;
    add_header Cache-Control no-store always;
    return 503 '{"error":{"code":"internal_error","message":"Service unavailable."}}';
    access_log off;
}

location = /companion/health {
    limit_except GET { deny all; }
    limit_req zone=lolicode_companion_http burst=5 nodelay;
    limit_req_status 429;
    error_page 429 = @lolicode_companion_rate_limited;
    proxy_pass http://127.0.0.1:13010/health;
    proxy_set_header Host lolicode-companion.internal;
    proxy_set_header X-Forwarded-Proto https;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Host "";
    proxy_set_header Forwarded "";
    proxy_connect_timeout 3s;
    proxy_read_timeout 5s;
    access_log off;
}
