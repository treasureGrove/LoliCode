# Include once inside nginx's http context. Do not duplicate this zone.
limit_req_zone $binary_remote_addr zone=lolicode_companion_handshake:1m rate=20r/m;
limit_conn_zone $binary_remote_addr zone=lolicode_companion_connections:1m;
limit_req_zone $binary_remote_addr zone=lolicode_companion_http:2m rate=120r/m;
limit_req_zone $binary_remote_addr zone=lolicode_companion_session:1m rate=6r/m;
