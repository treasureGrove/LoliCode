[package]
name = "lolicode-agent"
version = "0.1.0"
edition = "2021"
rust-version = "1.85"
license = "MIT"
description = "In-process LoliCode Rust coding core and legacy session DTO adapters"

[dependencies]
base64 = "0.22"
glob = "=0.3.3"
regex = "=1.12.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json", "stream"] }
tokio = { version = "1", features = ["process", "io-util", "fs", "sync", "time", "rt", "macros", "net"] }
tokio-tungstenite = { version = "0.24", default-features = false, features = ["handshake"] }
futures = "0.3"
uuid = { version = "1", features = ["v4"] }
url = "2"

[dev-dependencies]
tempfile = "3"
