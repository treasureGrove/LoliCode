server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name relay.lolicode.com;

    ssl_certificate /etc/letsencrypt/live/relay.lolicode.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/relay.lolicode.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    client_max_body_size 16m;

    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options SAMEORIGIN always;
    add_header Referrer-Policy same-origin always;

    # The public panel must never expose an alternative inference endpoint.
    location ~ ^/(v[0-9]+[a-z]*|mj|pg|suno)(/|$) { return 404; }
    location ~ ^/[^/]+/mj(/|$) { return 404; }

    # Ordinary visitors use the slim account and usage console.
    location = / { return 302 /account; }
    location = /pricing { return 302 /account; }
    location = /rankings { return 302 /account; }
    location = /about { return 302 /account; }
    location = /register {
        return 302 https://lolicode.com/all?account=register;
    }
    location = /sign-up {
        return 302 https://lolicode.com/all?account=register;
    }

    # A stable, bookmarkable management entry, separate from member login.
    location = /admin { return 302 /public-models-admin; }
    location = /admin/ { return 302 /public-models-admin; }

    location = /public-models-admin {
        alias /var/www/lolicode-relay-public/public-settings.html;
        default_type text/html;
        limit_except GET HEAD { deny all; }
        add_header Cache-Control no-store always;
        add_header X-Content-Type-Options nosniff always;
        add_header X-Frame-Options DENY always;
        add_header Content-Security-Policy "default-src 'none'; script-src 'self'; style-src 'self'; img-src 'self' https://lolicode.com; connect-src 'self'; base-uri 'none'; form-action 'self'; frame-ancestors 'none'" always;
        add_header Referrer-Policy same-origin always;
    }

    location = /admin-api/public-settings {
        client_max_body_size 64k;
        limit_req zone=lolicode_relay_admin_api burst=10 nodelay;
        limit_req_status 429;
        proxy_pass http://127.0.0.1:13001/admin/public-settings;
        proxy_set_header Cookie "";
        proxy_set_header X-Forwarded-For "";
        proxy_set_header Connection "";
        proxy_connect_timeout 3s;
        proxy_read_timeout 30s;
        proxy_cache off;
        add_header Cache-Control no-store always;
        add_header X-Content-Type-Options nosniff always;
    }

    location = /admin-api/upstream {
        client_max_body_size 64k;
        limit_req zone=lolicode_relay_admin_api burst=5 nodelay;
        limit_req_status 429;
        proxy_pass http://127.0.0.1:13001/admin/upstream;
        proxy_set_header Cookie "";
        proxy_set_header X-Forwarded-For "";
        proxy_set_header Connection "";
        proxy_connect_timeout 3s;
        proxy_read_timeout 240s;
        proxy_cache off;
        add_header Cache-Control no-store always;
        add_header X-Content-Type-Options nosniff always;
    }

    location = /admin-api/upstream/models {
        client_max_body_size 64k;
        limit_req zone=lolicode_relay_admin_api burst=10 nodelay;
        limit_req_status 429;
        proxy_pass http://127.0.0.1:13001/admin/upstream/models;
        proxy_set_header Cookie "";
        proxy_set_header X-Forwarded-For "";
        proxy_set_header Connection "";
        proxy_connect_timeout 3s;
        proxy_read_timeout 120s;
        proxy_cache off;
        add_header Cache-Control no-store always;
        add_header X-Content-Type-Options nosniff always;
    }

    location = /login { return 302 /account; }
    location = /sign-in {
        if ($arg_admin != "1") { return 302 /account; }
        include /etc/nginx/snippets/lolicode-relay-admin-proxy.conf;
        proxy_set_header Accept-Encoding "";
        sub_filter_once on;
        sub_filter '</head>' '<link rel="stylesheet" href="/relay-assets/admin-theme.css?v=20261021-4"><link rel="stylesheet" href="/relay-assets/public-account.css?v=20261028-admin1"><script src="/relay-assets/portal-host.js?v=20261028-admin1" defer></script><script src="/relay-assets/public-account.js?v=20261028-admin1" defer></script></head>';
    }

    location = /account {
        alias /var/www/lolicode-relay-public/account.html;
        default_type text/html;
        limit_except GET HEAD { deny all; }
        add_header Cache-Control no-store always;
        add_header X-Content-Type-Options nosniff always;
        add_header X-Frame-Options DENY always;
        add_header Content-Security-Policy "default-src 'none'; script-src 'self'; style-src 'self'; img-src 'self' https://lolicode.com; connect-src 'self'; base-uri 'none'; form-action 'self'; frame-ancestors 'none'" always;
        add_header Referrer-Policy same-origin always;
    }

    location = /account-api/login {
        client_max_body_size 8k;
        limit_req zone=lolicode_relay_admin_login burst=3 nodelay;
        limit_req_status 429;
        proxy_pass http://127.0.0.1:13001/web/login;
        proxy_set_header Authorization "";
        proxy_set_header X-Forwarded-For "";
        proxy_set_header Connection "";
        proxy_connect_timeout 3s;
        proxy_read_timeout 30s;
        proxy_cache off;
        add_header Cache-Control no-store always;
        add_header X-Content-Type-Options nosniff always;
    }

    location ^~ /account-api/ {
        client_max_body_size 8k;
        limit_req zone=lolicode_relay_admin_api burst=10 nodelay;
        limit_req_status 429;
        proxy_pass http://127.0.0.1:13001/web/;
        proxy_set_header Authorization "";
        proxy_set_header X-Forwarded-For "";
        proxy_set_header Connection "";
        proxy_connect_timeout 3s;
        proxy_read_timeout 30s;
        proxy_cache off;
        add_header Cache-Control no-store always;
        add_header X-Content-Type-Options nosniff always;
    }

    location = /relay-assets/index.html {
        root /var/www/lolicode-relay-public;
        try_files /index.html =404;
        default_type text/html;
        add_header Cache-Control no-cache always;
        add_header X-Content-Type-Options nosniff always;
        add_header X-Frame-Options SAMEORIGIN always;
        add_header Content-Security-Policy "default-src 'none'; script-src 'self'; style-src 'self'; img-src 'self' https://lolicode.com; connect-src 'self'; base-uri 'none'; form-action 'none'; frame-ancestors 'self'" always;
    }

    location ^~ /relay-assets/ {
        alias /var/www/lolicode-relay-public/;
        limit_except GET HEAD { deny all; }
        autoindex off;
        add_header Cache-Control "public, max-age=3600";
        add_header X-Content-Type-Options nosniff always;
    }

    location = /community-status {
        limit_except GET HEAD { deny all; }
        limit_req zone=lolicode_relay_admin_api burst=10 nodelay;
        limit_req_status 429;
        proxy_pass http://127.0.0.1:13001/public/status;
        proxy_set_header Cookie "";
        proxy_set_header Authorization "";
        proxy_set_header X-Forwarded-For "";
        proxy_set_header Connection "";
        proxy_connect_timeout 3s;
        proxy_read_timeout 5s;
        proxy_cache off;
        add_header Cache-Control no-store always;
        # This anonymous response is also read by the official opaque-origin sandbox.
        add_header Access-Control-Allow-Origin "*" always;
    }

    location = /api/user/login {
        limit_req zone=lolicode_relay_admin_login burst=5 nodelay;
        limit_req_status 429;
        include /etc/nginx/snippets/lolicode-relay-admin-proxy.conf;
    }

    location /api/ {
        limit_req zone=lolicode_relay_admin_api burst=60 nodelay;
        limit_req_status 429;
        include /etc/nginx/snippets/lolicode-relay-admin-proxy.conf;
    }

    location ^~ /static/ {
        limit_except GET HEAD { deny all; }
        include /etc/nginx/snippets/lolicode-relay-admin-proxy.conf;
    }

    location / {
        limit_except GET HEAD { deny all; }
        include /etc/nginx/snippets/lolicode-relay-admin-proxy.conf;
        proxy_set_header Accept-Encoding "";
        sub_filter_once on;
        sub_filter '</head>' '<link rel="stylesheet" href="/relay-assets/admin-theme.css?v=20261021-4"><link rel="stylesheet" href="/relay-assets/public-account.css?v=20261028-admin1"><script src="/relay-assets/portal-host.js?v=20261028-admin1" defer></script><script src="/relay-assets/public-account.js?v=20261028-admin1" defer></script></head>';
    }
}
