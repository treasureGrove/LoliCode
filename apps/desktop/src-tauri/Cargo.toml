[package]
name = "freehub-desktop"
version = "0.1.0"
description = "FreeHub local model gateway"
edition = "2021"
default-run = "freehub"

[[bin]]
name = "freehub"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
freehub-gateway = { path = "../../../crates/gateway" }
tauri = { version = "2", features = [] }
tauri-plugin-single-instance = "2"
tauri-plugin-opener = "2"
arboard = "3"
serde = { version = "1", features = ["derive"] }
tokio = { version = "1", features = ["sync"] }
tokio-util = "0.7"

[features]
custom-protocol = ["tauri/custom-protocol"]
