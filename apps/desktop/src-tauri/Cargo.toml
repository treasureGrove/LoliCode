[package]
name = "tai-switch-desktop"
version = "0.2.0"
description = "TAI Switch local AI router"
edition = "2021"
default-run = "tai-switch"

[[bin]]
name = "tai-switch"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
freehub-gateway = { path = "../../../crates/gateway" }
tauri = { version = "2", features = [] }
tauri-plugin-single-instance = "2"
tauri-plugin-opener = "2"
arboard = "3"
serde = { version = "1", features = ["derive"] }
tokio = { version = "1", features = ["sync"] }
tokio-util = "0.7"

[features]
custom-protocol = ["tauri/custom-protocol"]
